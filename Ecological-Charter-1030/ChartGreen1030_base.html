<!doctype html>
<html lang="en">

<head>
    <title>GIS 1030</title>
    <link rel="shortcut icon" href="css/images/logo1030GeoData.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">
    <link rel="stylesheet" href="css/easy-button.css">
</head>

<body>
    <div id="map">
    </div>
    <script src="js/qgis2web_expressions.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/L.Control.Layers.Tree.min.js"></script>
    <script src="js/leaflet.rotatedMarker.js"></script>
    <script src="js/leaflet.pattern.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/Autolinker.min.js"></script>
    <script src="js/rbush.min.js"></script>
    <script src="js/labelgun.min.js"></script>
    <script src="js/labels.js"></script>
    <script src="js/leaflet.photon.js"></script>
    <script src="js/easy-button.js"></script>

    <script src="js/Leaflet.Control.Custom.js"></script>
    <script src="js/common.js"></script>

    <script src="data/SchaerbekBorders/LimitesSchaerbeekQuartiers.js"></script>
    <script src="data/SchaerbekBorders/LimitesScaherbeek.js"></script>
    <script src="data/SchaerbekBorders/BlockParcelSchaerbeek_Contour_V3.js"></script>
    <script>
        var map = L.map('map', {
            zoomControl: false, maxZoom: 23, minZoom: 1
        }).fitBounds([[50.84242805691727, 4.35343370855978], [50.88164566987217, 4.4308537948872715]]);

        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('©GeoData1030: geodata.gis1030@gmail.com <a href="https://www.1030.be/" target="_blank" >Commune de Schaerbeek</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a>');
        var autolinker = new Autolinker({ truncate: { length: 30, location: 'smart' } });

        initTitleControl(map, '<h2>GIS 1030</h2>');
        initAbstractControl(map, 'Base cartographique de Schaerbeek : limites communales, limites des quartiers et contour des îlots.<br /><br />Carte de support — d\'autres couches thématiques seront ajoutées prochainement.');
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var basemaps = initBasemaps(map);
        var layer_OpenStreetMap_0 = basemaps.osm;
        var layer_GoogleTerrain_1 = basemaps.terrain;
        var layer_GoogleSatellite_0 = basemaps.satellite;

        function pop_LimitesSchaerbeekQuartiers_2(feature, layer) {
            layer.on({
                mouseout: function (e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function (feature) {
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Quartier</th>\
                        <td class="visible-with-data" id="SectorName">' + (feature.properties['SectorName'] !== null ? autolinker.link(String(feature.properties['SectorName']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">are (m2)</th>\
                        <td class="visible-with-data" id="area (m2)">' + (feature.properties['area (m2)'] !== null ? autolinker.link(String(feature.properties['area (m2)']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">périmètre (m)</th>\
                        <td class="visible-with-data" id="perimeter (m)">' + (feature.properties['perimeter (m)'] !== null ? autolinker.link(String(feature.properties['perimeter (m)']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function (e) {
                addClassToPopupIfMedia(content, e.popup);
            });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_LimitesSchaerbeekQuartiers_2_0() {
            return {
                pane: 'pane_LimitesSchaerbeekQuartiers_2',
                opacity: 1,
                color: 'rgba(202,110,211,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 2.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(40,164,38,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_LimitesSchaerbeekQuartiers_2');
        map.getPane('pane_LimitesSchaerbeekQuartiers_2').style.zIndex = 404;
        map.getPane('pane_LimitesSchaerbeekQuartiers_2').style['mix-blend-mode'] = 'normal';
        var layer_LimitesSchaerbeekQuartiers_2 = new L.geoJson(json_LimitesSchaerbeekQuartiers_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_LimitesSchaerbeekQuartiers_2',
            layerName: 'layer_LimitesSchaerbeekQuartiers_2',
            pane: 'pane_LimitesSchaerbeekQuartiers_2',
            onEachFeature: pop_LimitesSchaerbeekQuartiers_2,
            style: style_LimitesSchaerbeekQuartiers_2_0,
        });
        map.addLayer(layer_LimitesSchaerbeekQuartiers_2);

        function pop_LimitesScaherbeek_3(feature, layer) {
            layer.on({
                mouseout: function (e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function (feature) {
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Secteur</th>\
                        <td class="visible-with-data" id="SectorName">' + (feature.properties['SectorName'] !== null ? autolinker.link(String(feature.properties['SectorName']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function (e) {
                addClassToPopupIfMedia(content, e.popup);
            });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_LimitesScaherbeek_3_0() {
            return {
                pane: 'pane_LimitesScaherbeek_3',
                opacity: 1,
                color: 'rgba(100,100,100,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 4.0,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(100,100,100,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_LimitesScaherbeek_3');
        map.getPane('pane_LimitesScaherbeek_3').style.zIndex = 405;
        map.getPane('pane_LimitesScaherbeek_3').style['mix-blend-mode'] = 'normal';

        var layer_LimitesScaherbeek_3 = new L.geoJson(json_LimitesScaherbeek_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_LimitesScaherbeek_3',
            layerName: 'layer_LimitesScaherbeek_3',
            pane: 'pane_LimitesScaherbeek_3',
            onEachFeature: pop_LimitesScaherbeek_3,
            style: style_LimitesScaherbeek_3_0,
        });
        map.addLayer(layer_LimitesScaherbeek_3);

        function pop_BlockParcel1030(feature, layer) {
            layer.on({
                mouseout: function (e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function (feature) {
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">quartier</th>\
                        <td class="visible-with-data" id="Quartier">' + (feature.properties['Quartier'] !== null ? autolinker.link(String(feature.properties['Quartier']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">îlot (BlockParcel)</th>\
                        <td class="visible-with-data" id="BlockParcel">' + (feature.properties['BlockParcel'] !== null ? autolinker.link(String(feature.properties['BlockParcel']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">surface (m2)</th>\
                        <td class="visible-with-data" id="BlockParcel.Area (m2)">' + (feature.properties['BlockParcel.Area (m2)'] !== null ? autolinker.link(Number(feature.properties['BlockParcel.Area (m2)']).toFixed(2)) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">périmètre (m)</th>\
                        <td class="visible-with-data" id="BlockParcel.Perimeter (m)">' + (feature.properties['BlockParcel.Perimeter (m)'] !== null ? autolinker.link(Number(feature.properties['BlockParcel.Perimeter (m)']).toFixed(2)) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function (e) {
                addClassToPopupIfMedia(content, e.popup);
            });
            layer.bindPopup(content, { maxHeight: 400 });
        }

        map.createPane('pane_BlockParcel1030');
        map.getPane('pane_BlockParcel1030').style.zIndex = 402;
        map.getPane('pane_BlockParcel1030').style['mix-blend-mode'] = 'normal';
        function style_BlockParcel1030_0() {
            return {
                pane: 'pane_BlockParcel1030',
                opacity: 0.9,
                color: '#6f4f97',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.5,
                fill: true,
                fillOpacity: 0.25,
                fillColor: '#987db7',
                interactive: true,
            }
        }
        var layer_BlockParcel1030 = new L.geoJson(json_BlockParcel1030, {
            attribution: '',
            interactive: true,
            dataVar: 'json_BlockParcel1030',
            layerName: 'layer_BlockParcel1030',
            pane: 'pane_BlockParcel1030',
            onEachFeature: pop_BlockParcel1030,
            style: style_BlockParcel1030_0,
        });

        initSearchControl(map);
        new HomeControl().addTo(map);

        var overlaysTree = [
            {
                label: '<b>Schaerbeek</b>', children: [
                    { label: '<img src="legend/LimitesScaherbeek_3.png" /> Limites Scaherbeek', layer: layer_LimitesScaherbeek_3, radioGroup: 'bd' },
                    { label: '<span style="display:inline-block;width:12px;height:12px;background:#ca6ed3;border:1px solid #888;margin-right:4px;"></span>Limites Schaerbeek Quartiers', layer: layer_LimitesSchaerbeekQuartiers_2, radioGroup: 'bd' },
                    { label: 'Contour des îlots (BlockParcel)', layer: layer_BlockParcel1030 },]
            },

            { label: "Google Terrain", layer: layer_GoogleTerrain_1, radioGroup: 'bm' },
            { label: "Google Satellite", layer: layer_GoogleSatellite_0, radioGroup: 'bm' },
            { label: "OpenStreet Map", layer: layer_OpenStreetMap_0, radioGroup: 'bm' },]
        var lay = L.control.layers.tree(null, overlaysTree, {
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: false,
        });
        lay.addTo(map);
        initFooterControls(map);
        initFeedbackButton(map, 'Feedback: GIS 1030 (base)');
    </script>
</body>

</html>
